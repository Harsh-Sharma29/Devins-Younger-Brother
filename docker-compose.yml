services:
  postgres:
    image: postgres:16-alpine
    container_name: devin-brother-postgres
    environment:
      - POSTGRES_USER=devin
      - POSTGRES_PASSWORD=devin
      - POSTGRES_DB=devin_brother
    volumes:
      - dyb_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U devin -d devin_brother" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dyb_internal
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devin-backend
    ports:
      - "8005:8005"
    volumes:
      - dyb_chroma:/app/chroma_data
      - dyb_sandbox:/tmp/devin_brother_sandbox
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      HUGGINGFACEHUB_API_TOKEN: ${HUGGINGFACEHUB_API_TOKEN:-}
      DYB_SANDBOX_DIR: /tmp/devin_brother_sandbox
      DYB_DOCKER_VOLUME: devin_dyb_sandbox
      DATABASE_URL: postgresql://devin:devin@postgres:5432/devin_brother?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dyb_internal
    restart: unless-stopped


networks:
  dyb_internal:
    driver: bridge

volumes:
  dyb_postgres:
  dyb_chroma:
  dyb_sandbox:
