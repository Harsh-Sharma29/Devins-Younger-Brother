services:
  postgres:
    image: postgres:16-alpine
    container_name: autoforge-postgres
    environment:
      - POSTGRES_USER=autoforge
      - POSTGRES_PASSWORD=autoforge
      - POSTGRES_DB=autoforge
    volumes:
      - autoforge_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U autoforge -d autoforge" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - autoforge_internal
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoforge-backend
    ports:
      - "8005:8005"
    volumes:
      - autoforge_chroma:/app/chroma_data
      - autoforge_sandbox:/tmp/autoforge_sandbox
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      HUGGINGFACEHUB_API_TOKEN: ${HUGGINGFACEHUB_API_TOKEN:-}
      AUTOFORGE_SANDBOX_DIR: /tmp/autoforge_sandbox
      AUTOFORGE_DOCKER_VOLUME: autoforge_sandbox
      DATABASE_URL: postgresql://autoforge:autoforge@postgres:5432/autoforge?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autoforge_internal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoforge-frontend
    ports:
      - "3005:3005"
    environment:
      NEXT_PUBLIC_API_URL: http://autoforge-backend:8005
    depends_on:
      - backend
    networks:
      - autoforge_internal
    restart: unless-stopped

networks:
  autoforge_internal:
    driver: bridge

volumes:
  autoforge_postgres:
  autoforge_chroma:
  autoforge_sandbox:
    name: autoforge_sandbox
